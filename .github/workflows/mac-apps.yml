name: Mac-Apps bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Als neues Release veröffentlichen. Die Version steht in der Datei VERSION und muss neu sein."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versionsnummer prüfen
        run: |
          python - <<'PY'
          import re
          import sys

          version = open("VERSION").read().strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              sys.exit("VERSION ist keine Versionsnummer: " + version)
          print("Version", version)
          PY
      - name: Bibliotheken für die Oberflächen-Tests installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
          pip install pyflakes PySide6
      - name: Code auf Tippfehler prüfen (nicht definierte Namen, vergessene Importe)
        run: python -m pyflakes klartext screenshot-tool tools
      - name: Klartext testen
        run: python -m unittest discover -s klartext/tests -v
      - name: Bildschirm-Werkzeug testen
        working-directory: screenshot-tool
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  build:
    needs: tests
    # Gebaut wird nur auf Knopfdruck (Actions > Mac-Apps bauen > Run workflow), nicht bei jedem Push
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14 # Apple Silicon (M1 und neuer)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version lesen und prüfen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION"
          if [ "${{ inputs.release }}" = "true" ] && gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Das Release v$VERSION gibt es schon. Bitte zuerst die Datei VERSION erhöhen."
            exit 1
          fi

      - name: Klartext bauen
        run: bash klartext/build_app.sh

      - name: Klartext prüfen (Version)
        run: test "$(klartext/dist/Klartext.app/Contents/MacOS/Klartext --version)" = "${{ steps.version.outputs.version }}"

      - name: Klartext prüfen (Bausteine)
        run: klartext/dist/Klartext.app/Contents/MacOS/Klartext --selftest

      - name: Klartext prüfen (Sprachmodell laden, darf sich nicht selbst neu starten)
        timeout-minutes: 10
        run: klartext/dist/Klartext.app/Contents/MacOS/Klartext --selftest-model

      - name: Bildschirm-Werkzeug bauen
        run: bash screenshot-tool/build_app.sh

      - name: Bildschirm-Werkzeug prüfen (Version)
        run: test "$(screenshot-tool/dist/Bildschirm-Werkzeug.app/Contents/MacOS/Bildschirm-Werkzeug --version)" = "${{ steps.version.outputs.version }}"

      - name: Bildschirm-Werkzeug prüfen (Bausteine)
        run: screenshot-tool/dist/Bildschirm-Werkzeug.app/Contents/MacOS/Bildschirm-Werkzeug --selftest

      - name: ZIP-Dateien packen
        run: |
          mkdir release
          ditto -c -k --keepParent klartext/dist/Klartext.app release/Klartext-macOS-arm64.zip
          ditto -c -k --keepParent screenshot-tool/dist/Bildschirm-Werkzeug.app release/Bildschirm-Werkzeug-macOS-arm64.zip
          ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: mac-apps
          path: release/*.zip

      - name: Release veröffentlichen
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" release/*.zip --target "$GITHUB_SHA" --title "Version $VERSION" --generate-notes
